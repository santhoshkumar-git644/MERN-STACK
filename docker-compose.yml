version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mern_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mern_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/felicity
      - JWT_SECRET=felicity_super_secret_jwt_key_2024
      - EMAIL_USER=your_email@gmail.com
      - EMAIL_PASS=your_gmail_app_password
      - ADMIN_EMAIL=admin@felicity.com
      - ADMIN_PASSWORD=Admin@123
      - CLIENT_URL=http://localhost:5173
      - REDIS_URL=redis://redis:6379
      - CLOUDINARY_CLOUD_NAME=your_cloud_name
      - CLOUDINARY_API_KEY=your_api_key
      - CLOUDINARY_API_SECRET=your_api_secret
    depends_on:
      - mongodb
      - redis

  redis:
    image: redis:alpine
    container_name: mern_redis
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mern_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: mern_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  mongodb_data:
